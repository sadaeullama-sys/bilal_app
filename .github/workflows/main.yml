name: Build Veterinary Care Pro APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses
      - name: Generate Android platform files
        run: flutter create . --project-name veterinary_care_pro --platforms=android
      - name: Add camera permission for barcode scanner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text(encoding='utf-8')
          if 'android.permission.CAMERA' not in text:
              match = re.search(r'<manifest\b[^>]*>', text)
              if not match:
                  raise SystemExit('AndroidManifest.xml has no valid manifest opening tag')
              permission = '\n    <uses-permission android:name="android.permission.CAMERA" />'
              text = text[:match.end()] + permission + text[match.end():]
              p.write_text(text, encoding='utf-8')
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: veterinary-care-pro-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
